[package]
name = "scan-collector-rust"
version = "0.1.0"
edition = "2024"

[dependencies]
askama = "0.14"
axum = "0.8"
chrono = { version = "0.4", features = ["clock"] }
csv = "1"
hex = "0.4"
humantime = "2"
rand = "0.8"
rusqlite = { version = "0.38", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "fs", "sync"] }

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
