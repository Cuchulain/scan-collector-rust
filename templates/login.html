<!doctype html>
<html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Přihlášení · Scan Collector</title><style>
:root{color-scheme:light;font:16px/1.5 system-ui,sans-serif;color:#17212b;background:#f3f6f8}body{margin:0;min-height:100vh;display:grid;place-items:center}main{box-sizing:border-box;width:min(100% - 32px,420px);padding:30px;background:white;border-radius:12px;box-shadow:0 4px 24px #17212b14}h1{margin:0 0 8px}.muted{color:#5e6b75;margin:0 0 24px}label.field{display:block;margin:16px 0 5px;font-weight:600}input[type=text],input[type=password]{box-sizing:border-box;width:100%;padding:11px;border:1px solid #aab5bf;border-radius:7px;font:inherit}.remember{display:flex;gap:9px;align-items:flex-start;margin:18px 0}button{width:100%;border:0;border-radius:7px;padding:11px 14px;background:#155eef;color:white;font:inherit;cursor:pointer}.error{padding:10px 12px;border-radius:7px;background:#fff0f0;color:#a11;margin:16px 0 0}
</style></head><body><main><h1>Scan Collector</h1><p class="muted">Přihlaste se pro zobrazení uložených skenů.</p><form method="post" action="/login"><label class="field" for="username">Uživatelské jméno</label><input id="username" name="username" type="text" autocomplete="username" required><label class="field" for="password">Heslo</label><input id="password" name="password" type="password" autocomplete="current-password" required><label class="remember"><input type="checkbox" name="extended" value="on"><span>Prodloužené přihlášení (30 dní)</span></label><button type="submit">Přihlásit se</button></form>{% if error %}<p class="error" role="alert">Neplatné uživatelské jméno nebo heslo.</p>{% endif %}</main></body></html>
