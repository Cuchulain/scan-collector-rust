<!doctype html>
<html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Scan Collector</title><style>
:root{color-scheme:light;font:16px/1.5 system-ui,sans-serif;color:#17212b;background:#f3f6f8}body{margin:0}main{max-width:1000px;margin:0 auto;padding:32px 20px 64px}h1{margin:0 0 8px;font-size:clamp(1.7rem,4vw,2.4rem)}.muted{color:#5e6b75;margin:0 0 24px}table{width:100%;border-collapse:collapse;background:white;border-radius:10px;overflow:hidden;box-shadow:0 1px 4px #17212b12}th,td{padding:12px 14px;text-align:left;border-bottom:1px solid #e5eaee}th{background:#eaf0f5;font-size:.9rem}.count{font-variant-numeric:tabular-nums}.empty{padding:20px;background:white;border-radius:10px}form{margin:20px 0}button{border:0;border-radius:7px;padding:9px 14px;background:#155eef;color:white;font:inherit;cursor:pointer}a{color:#155eef}@media(max-width:650px){main{padding:22px 12px 40px}th,td{padding:9px 8px;font-size:.9rem}}
</style></head><body><main><h1>Scan Collector</h1><p class="muted">Přehled uložených sad podle data</p>
{% if sets.is_empty() %}<p class="empty">Zatím nejsou uložené žádné sady.</p>{% else %}<table><thead><tr><th>Datum</th><th>Počet záznamů</th><th></th></tr></thead><tbody>{% for set in sets %}<tr><td>{{ set.date }}</td><td class="count">{{ set.count }}</td><td><a href="/sets/{{ set.date }}">Zobrazit záznamy →</a></td></tr>{% endfor %}</tbody></table>{% endif %}
<form action="/logout" method="post"><button type="submit">Odhlásit</button></form></main></body></html>
